<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wizard Scorer</title>
    <meta name="description" content="Digitaler Punkteblock für das Kartenspiel Wizard. Kartenanzahl ansagen, Stiche schätzen, Punkte automatisch berechnen." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />

    <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- iOS kennt kein Manifest: Vollbild und Statusleiste müssen hier stehen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wizard" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />

    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <div class="actionbar" id="actionbar"></div>
    </div>

    <!-- Screenreader sollen den Wechsel des Screens mitbekommen. -->
    <p class="visually-hidden" id="announce" aria-live="polite" role="status"></p>

    <noscript>
      <p class="noscript">
        Wizard Scorer braucht JavaScript, um die Punkte zu berechnen.
        Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>
  </body>
</html>
