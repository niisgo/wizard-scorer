<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wizard Scorer</title>
    <meta name="description" content="Digitaler Punkteblock für das Kartenspiel Wizard. Kartenanzahl ansagen, Stiche schätzen, Punkte automatisch berechnen." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0b1a" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />

    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <div class="actionbar" id="actionbar"></div>
    </div>

    <noscript>
      <p class="noscript">
        Wizard Scorer braucht JavaScript, um die Punkte zu berechnen.
        Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>
  </body>
</html>
